[tool.poetry]
name = "eunomap"
version = "0.1.0"
description = ""
authors = ["Paulina Okulska"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = "^0.128.0"
sqlalchemy = "^2.0.45"
python-multipart = "^0.0.21"
httpx = "^0.28.1"
python-jose = "^3.5.0"
python-dotenv = "^1.2.1"
inflect = "^7.5.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
passlib = "^1.7.4"

# Optional heavy ML packages
whisper = "^1.1.10"
openai-whisper = {git = "https://github.com/openai/whisper.git"}
pyyaml = "^6.0.3"
streamlit = "^1.54.0"
streamlit-tags = "^1.2.8"

[tool.poetry.group.dev.dependencies]
uvicorn = "^0.40.0"
pytest = "^7.4.0"
black = "^24.0.0"


[tool.poetry.extras]
# Only the package names, no versions or Git URLs
whisper = ["whisper", "openai-whisper"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
